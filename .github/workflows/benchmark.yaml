name: Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npm -w packages/rapidhash-js run build

      - run: npm -w packages/benchmark run compile

      - run: npm -w packages/benchmark run bench:bytes
